SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
SPRING_DATASOURCE_USERNAME: sa
SPRING_DATASOURCE_PASSWORD: ""
SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
SPRING_DATA_REDIS_HOST: localhost
SPRING_DATA_REDIS_PORT: 6379
SPRING_DATA_REDIS_PASSWORD: ""
SPRING_DATA_REDIS_TIMEOUT: 2s
RABBITMQ_HOST: localhost
RABBITMQ_PORT: 5672
RABBITMQ_USERNAME: guest
RABBITMQ_PASSWORD: guest
AUTH_JWT_ISSUER: auth-service
AUTH_JWT_SECRET: test-secret
AUTH_RABBITMQ_CRITICAL_EXCHANGE: critical.exchange
USER_RABBITMQ_ACCOUNT_CREATED_QUEUE: user.account.created.queue
USER_RABBITMQ_ROUTING_ACCOUNT_CREATED: account.created
SERVER_PORT: 0
EUREKA_DEFAULT_ZONE: http://localhost:8761/eureka/
EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
EUREKA_INSTANCE_IP_ADDRESS: 127.0.0.1
EUREKA_INSTANCE_HOSTNAME: localhost
USER_SERVICE_INTERNAL_AUTH_HEADER_NAME: X-Internal-Api-Key
USER_SERVICE_INTERNAL_AUTH_API_KEY: test-key

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      repositories:
        enabled: false
  rabbitmq:
    listener:
      auto-startup: false
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
