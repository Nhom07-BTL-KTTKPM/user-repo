spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER}
    secret: ${AUTH_JWT_SECRET}

user:
  rabbitmq:
    critical-exchange: ${AUTH_RABBITMQ_CRITICAL_EXCHANGE}
    queue:
      account-created: ${USER_RABBITMQ_ACCOUNT_CREATED_QUEUE}
    routing:
      account-created: ${USER_RABBITMQ_ROUTING_ACCOUNT_CREATED}

server:
  port: ${SERVER_PORT}

eureka:
  client:
    register-with-eureka: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_CLIENT_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:host.docker.internal}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:host.docker.internal}

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  internal-service:
    header-name: ${USER_SERVICE_INTERNAL_AUTH_HEADER_NAME}
    api-key: ${USER_SERVICE_INTERNAL_AUTH_API_KEY}
